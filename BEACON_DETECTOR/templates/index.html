<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beacon Monitor</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; font-style: italic; }
  body {
    background: linear-gradient(135deg, #000000 0%, #1a0033 30%, #4c1d95 60%, #000000 100%);
    background-attachment: fixed;
    color: white; min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    padding: 20px;
  }
  .card {
    background: rgba(0,0,0,0.65);
    border: 2px solid #a855f7;
    border-radius: 25px; width: 100%; max-width: 520px;
    padding: 32px; text-align: center;
    box-shadow: 0 0 40px rgba(168,85,247,0.5);
  }
  h1 { font-size: 28px; margin-bottom: 6px; color: #e9d5ff; text-shadow: 0 0 15px #a855f7; }
  .sub { color: #c084fc; font-size: 14px; margin-bottom: 25px; }
  .circle {
    width: 140px; height: 140px; border-radius: 50%;
    margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
    font-size: 50px; border: 3px solid #a855f7;
  }
  .detected { background: linear-gradient(135deg, #22c55e, #14532d); box-shadow: 0 0 45px #22c55e; animation: pulse 1.5s infinite; }
  .not-detected { background: linear-gradient(135deg, #1a0033, #4c1d95); box-shadow: 0 0 30px #a855f7; }
  @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
  .status-text { font-size: 22px; font-weight: bold; margin-bottom: 22px; letter-spacing: 1px; }
  .status-text.green { color: #4ade80; text-shadow: 0 0 12px #22c55e; }
  .status-text.red { color: #e9d5ff; text-shadow: 0 0 12px #a855f7; }
  .info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; text-align: left; }
  .box { background: linear-gradient(135deg, #1a0033, #2e1065); border: 1px solid #7c3aed; padding: 15px; border-radius: 14px; }
  .box small { color: #c084fc; font-size: 12px; display: block; margin-bottom: 4px; }
  .box b { font-size: 16px; color: white; }
  .events { background: rgba(0,0,0,0.5); border: 1px solid #7c3aed; border-radius: 14px; padding: 15px; text-align: left; max-height: 180px; overflow-y: auto; }
  .events h3 { font-size: 14px; margin-bottom: 10px; color: #c084fc; }
  .event { font-size: 13px; padding: 8px 0; border-bottom: 1px solid #2e1065; display: flex; justify-content: space-between; }
  .event:last-child { border: none; }
  .footer { margin-top: 15px; font-size: 12px; color: #a78bfa; }
</style>
</head>
<body>
  <div class="card">
    <h1>📡 <i>Beacon Monitor</i></h1>
    <p class="sub"><i>Live Beacon Detection Dashboard</i></p>
    <div id="circle" class="circle not-detected">📡</div>
    <div id="statusText" class="status-text red"><i>BEACON NOT DETECTED</i></div>
    <div class="info">
      <div class="box"><small><i>Beacon Name</i></small><b><i id="beaconName">-</i></b></div>
      <div class="box"><small><i>Beacon ID</i></small><b><i id="beaconId">-</i></b></div>
      <div class="box"><small><i>Last Seen</i></small><b><i id="lastSeen">Never</i></b></div>
      <div class="box"><small><i>Total Heartbeats</i></small><b><i id="total">0</i></b></div>
    </div>
    <div class="events"><h3><i>Recent Events</i></h3><div id="eventList"><p style="color:#a78bfa;font-size:13px;"><i>Waiting for beacon...</i></p></div></div>
    <p class="footer"><i>Auto-refresh every 1 second • Timeout: 8s</i></p>
  </div>
<script>
  async function loadStatus(){
    try{
      const res = await fetch('/api/status');
      const data = await res.json();
      const circle = document.getElementById('circle');
      const statusText = document.getElementById('statusText');
      if(data.detected){
        circle.className = 'circle detected'; circle.textContent = '✅';
        statusText.innerHTML = '<i>BEACON DETECTED</i>'; statusText.className = 'status-text green';
      } else {
        circle.className = 'circle not-detected'; circle.textContent = '📡';
        statusText.innerHTML = '<i>BEACON NOT DETECTED</i>'; statusText.className = 'status-text red';
      }
      document.getElementById('beaconName').textContent = data.source_name;
      document.getElementById('beaconId').textContent = data.source_id || '-';
      document.getElementById('lastSeen').textContent = data.last_seen + (data.seconds_since !== null ? ` (${data.seconds_since}s ago)` : '');
      document.getElementById('total').textContent = data.total_heartbeats;
      const list = document.getElementById('eventList');
      if(data.events && data.events.length > 0){
        list.innerHTML = data.events.map(e => `<div class="event"><span><i>${e.source_id} - ${e.status}</i></span><b><i>${e.time}</i></b></div>`).join('');
      }
    } catch(e){}
  }
  loadStatus(); setInterval(loadStatus, 1000);
</script>
</body>
</html>
